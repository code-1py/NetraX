[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netrax"
version = "0.1.6"
description = "Async Python wrapper for Nmap"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

authors = [{ name = "Bhavya Malhotra" }]
requires-python = ">=3.11"
keywords = ["nmap", "network", "scanner", "async", "asyncio", "security", "port-scanner"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
    "Topic :: Security",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/code-1py/NetraX#readme"
Repository = "https://github.com/code-1py/NetraX"
Issues = "https://github.com/code-1py/NetraX/issues"
Documentation = "https://netrax.readthedocs.io/en/latest/"
Changelog = "https://github.com/code-1py/NetraX/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["netrax*"]
namespaces = false
exclude = ["venv*", ".venv*", "env*", "build*", "dist*", "*.egg-info*"]

[tool.check-manifest]
ignore = [
    "CHANGELOG.md",
    "docs/**",
    "requirements/**",
    ".readthedocs.yaml",
    ".github/**",
]
